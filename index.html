<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nine Gates EC Stable Portal</title>
    
    <!-- 1. The Cache Shield: Tells browsers never to hold onto this specific HTML file wrapper -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; margin: 0; padding: 20px; color: #1d1d1f; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1, h2 { text-align: center; color: #1c3d5a; margin-top: 5px; }
        .hidden { display: none !important; }
        .btn { display: block; width: 100%; padding: 15px; font-size: 16px; border: none; border-radius: 12px; background: #0071e3; color: white; cursor: pointer; font-weight: 600; text-align: center; margin-top: 15px; box-sizing: border-box; }
        .btn:hover { background: #005bb5; }
        .btn-secondary { background: #e8e8ed; color: #1d1d1f; margin-top: 10px; }
        .input-field { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #e8e8ed; border-radius: 12px; font-size: 16px; box-sizing: border-box; background: white; }
        .tab-menu { display: flex; justify-content: space-around; border-bottom: 2px solid #e8e8ed; margin-bottom: 20px; }
        .tab-menu .tab-btn { background: none; border: none; padding: 10px 10px; font-size: 14px; font-weight: 600; color: #86868b; cursor: pointer; }
        .tab-menu .tab-btn.active { color: #0071e3; border-bottom: 3px solid #0071e3; }
        .alert-banner { background: #ff3b30; color: white; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 14px; margin-bottom: 15px; text-align: center; }
        .notice-board { background: #fbfbfd; border: 1px solid #e8e8ed; border-radius: 12px; padding: 15px; margin-bottom: 20px; max-height: 150px; overflow-y: auto; }
        .notice-item { border-bottom: 1px solid #e8e8ed; padding: 8px 0; font-size: 13px; }
        .card { background: #f5f5f7; padding: 15px; border-radius: 12px; margin-bottom: 12px; border-left: 5px solid #0071e3; position: relative; }
        .card.admin-card { border-left-color: #ff9500; }
        .card h4 { margin: 0 0 5px 0; color: #1d1d1f; }
        .card p { margin: 0; font-size: 13px; color: #86868b; line-height: 1.4; }
        .status-msg { text-align: center; font-size: 12px; color: #86868b; margin-top: 10px; }
    </style>

    <script>
        let activeUser = null;
        let mockHorses = [
            { id: 1, name: "Biscuit", owner_username: "sophia", feed_notes: "1 scoop chaff morning only", rug_instructions: "Lightweight turnout" },
            { id: 2, name: "Storm", owner_username: "adam", feed_notes: "High fibre nuts", rug_instructions: "Heavyweight stable rug" }
        ];

        // 2. Automated Version Control: Change this number whenever we publish updates!
        // This forces every browser to drop old file memory and download fresh features instantly.
        const APP_VERSION = "1.0.2"; 

        function executeImmediateLogin() {
            let u = document.getElementById('login-username').value.trim().toLowerCase();
            let p = document.getElementById('login-pin').value.trim();
            
            if (u === 'adam' && p === '321') {
                activeUser = { username: 'adam', display_name: 'Adam (Admin)', role: 'admin' };
            } else if (u === 'sophia' && p === '1234') {
                activeUser = { username: 'sophia', display_name: 'Sophia L', role: 'livery' };
            } else {
                document.getElementById('login-error').innerText = '❌ Invalid credentials. Try adam/321 or sophia/1234';
                return;
            }
            
            localStorage.setItem('yard_session_user', JSON.stringify(activeUser));
            localStorage.setItem('yard_app_version', APP_VERSION);
            launchPortalDashboard();
        }

        window.onload = function() {
            // 3. Automated Force-Refresh Logic
            const savedVersion = localStorage.getItem('yard_app_version');
            if (savedVersion && savedVersion !== APP_VERSION) {
                localStorage.clear(); // Wipe version cache mismatch
                location.reload(true); // Hard refresh browser view
                return;
            }

            const cachedUser = localStorage.getItem('yard_session_user');
            if (cachedUser) {
                activeUser = JSON.parse(cachedUser);
                launchPortalDashboard();
            }
        }

        function launchPortalDashboard() {
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-main').classList.remove('hidden');
            
            const isAdmin = activeUser.role === 'admin';
            document.getElementById('portal-title').innerText = isAdmin ? "Nine Gates Manager 👑" : `Hello, ${activeUser.display_name} 🐴`;
            
            document.getElementById('admin-horse-section').className = isAdmin ? "" : "hidden";
            document.getElementById('admin-notice-section').className = isAdmin ? "" : "hidden";
            
            renderHorses();
        }

        function logOutPortal() {
            localStorage.clear();
            location.reload();
        }

        function switchTab(tab) {
            ['diary', 'horses', 'notice', 'account'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('tab-' + t + '-btn').classList.remove('active');
            });
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab + '-btn').classList.add('active');
        }

        function renderHorses() {
            const list = document.getElementById('horses-list');
            list.innerHTML = "";
            const filtered = activeUser.role === 'admin' ? mockHorses : mockHorses.filter(h => h.owner_username === activeUser.username);
            
            filtered.forEach(item => {
                list.innerHTML += `<div class="card">
                    <h4>🐴 ${item.name}</h4>
                    <p><strong>Owner:</strong> ${item.owner_username}</p>
                    <p><strong>🥣 Feed:</strong> ${item.feed_notes}</p>
                    <p><strong>🧥 Rugs:</strong> ${item.rug_instructions}</p>
                </div>`;
            });
        }

        function saveDiaryEntry() {
            const list = document.getElementById('diary-list');
            const fac = document.getElementById('diary-facility').value;
            const dt = document.getElementById('diary-date').value;
            const tm = document.getElementById('diary-time').value;
            const nt = document.getElementById('diary-notes').value;
            if(!dt || !tm) return alert("Date and Time required!");
            list.innerHTML += `<div class="card">
                <h4>📅 ${dt} @ ${tm} - ${fac}</h4>
                <p><strong>Rider/Notes:</strong> ${activeUser.display_name} - ${nt}</p>
                </div>`;
        }

        function saveHorseProfile() {
            const horse = {
                id: mockHorses.length + 1,
                name: document.getElementById('horse-name').value,
                owner_username: document.getElementById('horse-owner').value.trim().toLowerCase(),
                feed_notes: document.getElementById('horse-feed').value,
                rug_instructions: document.getElementById('horse-rug').value
            };
            mockHorses.push(horse);
            renderHorses();
        }

        function broadcastNotice() {
            const msg = document.getElementById('notice-msg').value;
            const board = document.getElementById('full-notice-list');
            board.innerHTML = `<div class="notice-item"><strong>[${activeUser.display_name}]:</strong> ${msg}</div>` + board.innerHTML;
            document.getElementById('notice-msg').value = "";
        }
    </script>
</head>
<body>
<div class="container">
    
    <!-- SCREEN 1: LOGIN -->
    <div id="screen-login">
        <h1>🐴 Nine Gates EC</h1>
        <h2 style="font-size: 15px; color:#86868b;">Sign in with your Yard Credentials</h2>
        <input type="text" id="login-username" class="input-field" placeholder="Username (e.g. adam)">
        <input type="password" id="login-pin" class="input-field" placeholder="4-Digit Security PIN">
        <button class="btn" onclick="executeImmediateLogin()">Sign In</button>
        <div id="login-error" style="color: red; text-align:center; font-size:14px; margin-top:10px;"></div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="screen-main" class="hidden">
        <div id="emergency-banner" class="alert-banner hidden">⚠️ NOTICE: Loading alerts...</div>
        <h1 id="portal-title">Nine Gates Portal</h1>
        <div id="status-text" class="status-msg">Shielded Testing Engine Active</div>
        
        <div class="tab-menu">
            <button id="tab-diary-btn" class="tab-btn active" onclick="switchTab('diary')">📅 Diary</button>
            <button id="tab-horses-btn" class="tab-btn" onclick="switchTab('horses')">🐴 Horses</button>
            <button id="tab-notice-btn" class="tab-btn" onclick="switchTab('notice')">📣 Board</button>
            <button id="tab-account-btn" class="tab-btn" onclick="switchTab('account')">🔒 Security</button>
        </div>

        <!-- TAB 1: CALENDAR DIARY -->
        <div id="tab-diary">
            <div id="diary-list">
                <div class="card">
