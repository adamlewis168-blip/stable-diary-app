<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nine Gates EC Stable Diary</title>
    
    <!-- PWA Settings to make it act like a native phone app -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nine Gates">
    
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; margin: 0; padding: 20px; color: #1d1d1f; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1, h2 { text-align: center; color: #1c3d5a; margin-top: 5px; }
        .hidden { display: none; }
        .btn { display: block; width: 100%; padding: 15px; font-size: 16px; border: none; border-radius: 12px; background: #0071e3; color: white; cursor: pointer; font-weight: 600; text-align: center; margin-top: 15px; box-sizing: border-box; }
        .btn:hover { background: #005bb5; }
        .btn-secondary { background: #e8e8ed; color: #1d1d1f; margin-top: 10px; }
        .btn-secondary:hover { background: #d2d2d7; }
        .input-field { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #e8e8ed; border-radius: 12px; font-size: 16px; box-sizing: border-box; }
        .tab-menu { display: flex; justify-content: space-around; border-bottom: 2px solid #e8e8ed; margin-bottom: 20px; }
        .tab-menu .tab-btn { background: none; border: none; padding: 10px 20px; font-size: 16px; font-weight: 600; color: #86868b; cursor: pointer; }
        .tab-menu .tab-btn.active { color: #0071e3; border-bottom: 3px solid #0071e3; }
        .card { background: #f5f5f7; padding: 15px; border-radius: 12px; margin-bottom: 12px; border-left: 5px solid #0071e3; }
        .card.admin-card { border-left-color: #ff9500; }
        .card h4 { margin: 0 0 5px 0; color: #1d1d1f; }
        .card p { margin: 0; font-size: 14px; color: #86868b; }
        .status-msg { text-align: center; font-size: 12px; color: #86868b; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- SCREEN 1: SECURE GATE LOCK -->
    <div id="screen-gate">
        <h1>🐴 Nine Gates EC</h1>
        <h2 style="font-size: 16px; color:#86868b;">Enter Gate Code to Access</h2>
        <input type="password" id="gate-pass" class="input-field" placeholder="Enter password...">
        <button class="btn" onclick="checkGateCode()">Unlock App</button>
        <div id="gate-error" style="color: red; text-align:center; font-size:14px; margin-top:10px;"></div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="screen-main" class="hidden">
        <h1 id="app-title">Nine Gates EC Portal</h1>
        <div id="status-text" class="status-msg">Loading stable data...</div>
        
        <!-- Navigation Tabs -->
        <div class="tab-menu">
            <button id="tab-diary-btn" class="tab-btn active" onclick="switchTab('diary')">📅 Diary</button>
            <button id="tab-horses-btn" class="tab-btn" onclick="switchTab('horses')">🐴 Horses</button>
        </div>

        <!-- TAB 1: DIARY VIEW -->
        <div id="tab-diary">
            <div id="diary-list"><!-- Bookings dynamically go here --></div>
            <hr style="border: 0; border-top: 1px solid #e8e8ed; margin: 20px 0;">
            <h3>Book Arena / Log Event</h3>
            <input type="date" id="diary-date" class="input-field">
            <input type="time" id="diary-time" class="input-field">
            <input type="text" id="diary-horse" class="input-field" placeholder="Horse or Rider Name">
            <input type="text" id="diary-notes" class="input-field" placeholder="Activity Notes (e.g., Arena booking, Vet)">
            <button class="btn" onclick="saveDiaryEntry()">Add to Diary</button>
        </div>

        <!-- TAB 2: HORSES VIEW -->
        <div id="tab-horses" class="hidden">
            <div id="horses-list"><!-- Horses profiles dynamically go here --></div>
            
            <!-- Admin Only Section -->
            <div id="admin-section" class="hidden">
                <hr style="border: 0; border-top: 1px solid #e8e8ed; margin: 20px 0;">
                <h3 style="color:#ff9500;">Manager Panel: Add New Horse</h3>
                <input type="text" id="horse-name" class="input-field" placeholder="Horse Name">
                <input type="text" id="horse-owner" class="input-field" placeholder="Owner Name">
                <input type="text" id="horse-feed" class="input-field" placeholder="Feeding Instructions">
                <input type="text" id="horse-rug" class="input-field" placeholder="Rug Instructions">
                <button class="btn" style="background:#ff9500;" onclick="saveHorseProfile()">Register Horse</button>
            </div>
        </div>

        <button class="btn btn-secondary" onclick="lockApp()">Lock App</button>
    </div>
</div>

<script>
    const SUPABASE_URL = "https://supabase.co";
    const SUPABASE_KEY = "sb_publishable_d5zidl919MKlzxB2sLMvtg_NF_N77qz";

    // Secure encrypted password hashes
    const LIVERY_HASH = "8438f40af8ad36dc90237479f75c1fa20df128cb113ed6a5326cf6489997a4a7"; // Scrambled "StableGate2026"
    const ADMIN_HASH = "029208ee43ab7c07ba848f5faafa6fc29b807d693dad6ed4736eb1f71409b389";  // Scrambled "AdminManager2026"

    let currentRole = "livery";

    async function sha256(str) {
        const buf = new TextEncoder().encode(str);
        const hash = await crypto.subtle.digest('SHA-256', buf);
        return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    window.onload = function() {
        const savedRole = localStorage.getItem('yard_role');
        if (savedRole) {
            currentRole = savedRole;
            launchPortal();
        }
    }

    async function checkGateCode() {
        const input = document.getElementById('gate-pass').value;
        if (!input) return;
        const inputHash = await sha256(input);
        
        if (inputHash === ADMIN_HASH) {
            currentRole = "admin";
            localStorage.setItem('yard_role', 'admin');
            launchPortal();
        } else if (inputHash === LIVERY_HASH) {
            currentRole = "livery";
            localStorage.setItem('yard_role', 'livery');
            launchPortal();
        } else {
            document.getElementById('gate-error').innerText = "❌ Invalid Gate Code. Try again.";
        }
    }

    function launchPortal() {
        document.getElementById('screen-gate').classList.add('hidden');
        document.getElementById('screen-main').classList.remove('hidden');
        document.getElementById('app-title').innerText = currentRole === "admin" ? "Nine Gates EC Manager 👑" : "Nine Gates EC Portal 🐴";
        
        if (currentRole === "admin") {
            document.getElementById('admin-section').classList.remove('hidden');
        } else {
            document.getElementById('admin-section').classList.add('hidden');
        }
        
        fetchDiary();
        fetchHorses();
    }

    function lockApp() {
        localStorage.clear();
        location.reload();
    }

    function switchTab(tab) {
        if (tab === 'diary') {
            document.getElementById('tab-diary').classList.remove('hidden');
            document.getElementById('tab-horses').classList.add('hidden');
            document.getElementById('tab-diary-btn').classList.add('active');
            document.getElementById('tab-horses-btn').classList.remove('active');
        } else {
            document.getElementById('tab-diary').classList.add('hidden');
            document.getElementById('tab-horses').classList.remove('hidden');
            document.getElementById('tab-diary-btn').classList.remove('active');
            document.getElementById('tab-horses-btn').classList.add('active');
        }
    }

    function supabaseFetch(endpoint) {
        return fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
            method: 'GET',
            headers: {
                'apikey': SUPABASE_KEY
            }
        }).then(res => res.json());
    }

    function supabaseInsert(endpoint, payload) {
        return fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, {
            method: 'POST',
            headers: {
                'apikey': SUPABASE_KEY,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });
    }

    function fetchDiary() {
        supabaseFetch('yard_diary?order=booking_date.asc,start_time.asc')
        .then(data => {
            const list = document.getElementById('diary-list');
            list.innerHTML = (!data || data.length === 0) ? "<p>No entries found.</p>" : "";
            if(data && data.length > 0) {
                data.forEach(item => {
                    list.innerHTML += `
                        <div class="card">
                            <h4>📅 ${item.booking_date} @ ${item.start_time.slice(0,5)}</h4>
                            <p><strong>Rider/Horse:</strong> ${item.horse_or_person}</p>
                            <p><strong>Note:</strong> ${item.activity_notes}</p>
                        </div>
                    `;
                });
            }
            document.getElementById('status-text').innerText = "☁️ Real-time Cloud Synced";
        }).catch(() => {
            document.getElementById('status-text').innerText = "⚠️ Error loading data.";
        });
    }

    function fetchHorses() {
        supabaseFetch('horses?order=name.asc')
        .then(data => {
            const list = document.getElementById('horses-list');
            list.innerHTML = (!data || data.length === 0) ? "<p>No horse metrics logged.</p>" : "";
