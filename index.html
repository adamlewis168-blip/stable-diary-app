<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nine Gates EC Stable Portal</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f7; margin: 0; padding: 20px; color: #1d1d1f; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1, h2, h3 { text-align: center; color: #1c3d5a; margin-top: 5px; }
        .hidden { display: none !important; }
        .btn { display: block; width: 100%; padding: 15px; font-size: 16px; border: none; border-radius: 12px; background: #0071e3; color: white; cursor: pointer; font-weight: 600; text-align: center; margin-top: 15px; box-sizing: border-box; }
        .btn:hover { background: #005bb5; }
        .btn-secondary { background: #e8e8ed; color: #1d1d1f; margin-top: 10px; }
        .btn-action { background: #34c759; color: white; padding: 6px 12px; border: none; border-radius: 8px; font-size: 13px; float: right; cursor: pointer; }
        .input-field { width: 100%; padding: 14px; margin: 8px 0; border: 2px solid #e8e8ed; border-radius: 12px; font-size: 15px; box-sizing: border-box; background: white; }
        .tab-menu { display: flex; justify-content: space-around; border-bottom: 2px solid #e8e8ed; margin-bottom: 20px; }
        .tab-menu .tab-btn { background: none; border: none; padding: 10px 5px; font-size: 13px; font-weight: 600; color: #86868b; cursor: pointer; }
        .tab-menu .tab-btn.active { color: #0071e3; border-bottom: 3px solid #0071e3; }
        .card { background: #f5f5f7; padding: 15px; border-radius: 12px; margin-bottom: 12px; border-left: 5px solid #0071e3; overflow: hidden; position: relative; }
        .card.manager-card { border-left-color: #ff9500; background: #fffcf7; }
        .card.completed-card { border-left-color: #34c759; background: #f4faf5; opacity: 0.7; }
        .card h4 { margin: 0 0 5px 0; color: #1d1d1f; }
        .card p { margin: 0; font-size: 13px; color: #86868b; line-height: 1.4; }
        .status-msg { text-align: center; font-size: 12px; color: #86868b; margin-top: 10px; }
    </style>

    <script>
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_publishable_d5zidl919MKlzxB2sLMvtg_NF_N77qz";
        const APP_VERSION = "1.0.6"; 
        let activeUser = null;

        function executeImmediateLogin() {
            let u = document.getElementById('login-username').value.trim().toLowerCase();
            let p = document.getElementById('login-pin').value.trim();
            
            if (u === 'adam' && p === '321') {
                activeUser = { username: 'adam', display_name: 'Adam', role: 'admin' };
            } else if (u === 'coleen' && p === '321') {
                activeUser = { username: 'coleen', display_name: 'Coleen', role: 'admin' };
            } else if (u === 'erin' && p === '5555') {
                activeUser = { username: 'erin', display_name: 'Erin', role: 'admin' };
            } else if (u === 'sophia' && p === '1234') {
                activeUser = { username: 'sophia', display_name: 'Sophia L', role: 'livery' };
            } else {
                document.getElementById('login-error').innerText = '❌ Access Denied. Check credentials.';
                return;
            }
            localStorage.setItem('yard_session_user', JSON.stringify(activeUser));
            localStorage.setItem('yard_app_version', APP_VERSION);
            launchPortalDashboard();
        }

        window.onload = function() {
            const savedVersion = localStorage.getItem('yard_app_version');
            if (savedVersion && savedVersion !== APP_VERSION) {
                localStorage.clear();
                location.reload(true);
                return;
            }
            const cachedUser = localStorage.getItem('yard_session_user');
            if (cachedUser) {
                activeUser = JSON.parse(cachedUser);
                launchPortalDashboard();
            }
        }

        function launchPortalDashboard() {
            document.getElementById('screen-login').classList.add('hidden');
            document.getElementById('screen-main').classList.remove('hidden');
            
            const isAdmin = activeUser.role === 'admin';
            document.getElementById('portal-title').innerText = isAdmin ? "Nine Gates Manager 👑" : "Nine Gates Yard Portal 🐴";
            
            document.getElementById('tab-rota-btn').className = isAdmin ? "tab-btn" : "hidden";
            document.getElementById('admin-rota-section').className = isAdmin ? "" : "hidden";
            document.getElementById('admin-vault-section').className = isAdmin ? "" : "hidden";
            
            fetchCalendar();
            fetchVaultDocs();
            if(isAdmin) fetchManagerRota();
        }

        function logOutPortal() {
            localStorage.clear();
            location.reload();
        }

        function switchTab(tab) {
            ['diary', 'rota', 'vault'].forEach(t => {
                const el = document.getElementById('tab-' + t);
                const btn = document.getElementById('tab-' + t + '-btn');
                if(el) el.classList.add('hidden');
                if(btn) btn.classList.remove('active');
            });
            document.getElementById('tab-' + tab).classList.remove('hidden');
            document.getElementById('tab-' + tab + '-btn').classList.add('active');
        }

        function apiCall(endpoint, method, payload = null) {
            const config = {
                method: method,
                headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' }
            };
            if(payload) config.body = JSON.stringify(payload);
            return fetch(`${SUPABASE_URL}/rest/v1/${endpoint}`, config).then(res => res.json());
        }

        // --- CALENDAR ---
        function fetchCalendar() {
            apiCall('shared_calendar?order=event_date.asc,event_time.asc', 'GET')
            .then(data => {
                const list = document.getElementById('diary-list');
                list.innerHTML = (!data || data.length === 0) ? "<p>No entries registered on the calendar.</p>" : "";
                if(data && data.length > 0) {
                    data.forEach(item => {
                        list.innerHTML += `<div class="card">
                            <h4>📅 ${item.event_date} @ ${item.event_time.slice(0,5)} - ${item.event_type}</h4>
                            <p><strong>Title/Rider:</strong> ${item.title}</p>
                            <p><strong>Details/Notes:</strong> ${item.notes || 'None logged.'}</p>
                            <p style="font-size:11px; margin-top:4px; color:#b8b8bc;">Logged by: ${item.posted_by}</p>
                        </div>`;
                    });
                }
                document.getElementById('status-text').innerText = "☁️ Real-time Cloud Synced";
            });
        }

        function saveDiaryEntry() {
            const payload = {
                event_type: document.getElementById('diary-facility').value,
                event_date: document.getElementById('diary-date').value,
                event_time: document.getElementById('diary-time').value,
                title: document.getElementById('diary-title').value,
                notes: document.getElementById('diary-notes').value,
                posted_by: activeUser.display_name
            };
            if(!payload.event_date || !payload.title) return alert("Date and event title are mandatory!");
            apiCall('shared_calendar', 'POST', payload).then(() => {
                fetchCalendar();
                document.getElementById('diary-title').value = "";
                document.getElementById('diary-notes').value = "";
            });
        }

        // --- MANAGER ROTA ---
        function fetchManagerRota() {
            apiCall('manager_rota?order=task_date.asc', 'GET').then(data => {
                const list = document.getElementById('rota-list');
                list.innerHTML = (!data || data.length === 0) ? "<p>No manager duties scheduled.</p>" : "";
                if(data && data.length > 0) {
                    data.forEach(item => {
                        const isDone = item.status === 'Completed';
                        list.innerHTML += `<div class="card ${isDone ? 'completed-card' : 'manager-card'}">
                            ${!isDone ? `<button class="btn-action" onclick="completeRotaTask(${item.id})">Done ✓</button>` : ''}
                            <h4>📋 ${item.task_name}</h4>
                            <p><strong>Target Date:</strong> ${item.task_date}</p>
                            <p><strong>Assigned Crew Member:</strong> <span style="font-weight:bold; color:#ff9500;">${item.assigned_to}</span></p>
                            <p style="margin-top:4px;">Status: <strong>${item.status}</strong></p>
                        </div>`;
                    });
                }
            });
        }

        function saveRotaTask() {
            const payload = {
                task_date: document.getElementById('rota-date').value,
                task_name: document.getElementById('rota-name').value,
                assigned_to: document.getElementById('rota-assign').value
            };
            if(!payload.task_date || !payload.task_name) return alert("Date and Task details required!");
            apiCall('manager_rota', 'POST', payload).then(() => {
                fetchManagerRota();
                document.getElementById('rota-name').value = "";
            });
        }
